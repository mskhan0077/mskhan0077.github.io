    Experience:
      - company: Multi-Robot Autonomy (MOON) Lab, IISER Bhopal
        position: Project Associate I
        location: Bhopal, India
        start_date: 2026-07
        end_date: present
        highlights:
          - Developing a bio-inspired surface vehicle for autonomous navigation in vegetation-choked and debris-laden waterways, where conventional propellers foul.
          - Building a Unity-based simulation environment for the lab's marine, ground and aerial platforms.
          - Investigating sim-to-real transfer of learned navigation policies onto the lab's ASV fleet, addressing hydrodynamic mismatch, sensor noise, actuation delay, etc.

      - company: Multi-Robot Autonomy (MOON) Lab, IISER Bhopal
        position: Graduate Researcher
        location: Bhopal, India
        start_date: 2025-06
        end_date: 2026-06
        highlights:
          - Developed MA-BaTS, a multi-agent adaptive bathymetric mapping framework using Gaussian Process field reconstruction with Thompson Sampling acquisition; achieved ~68% reduction in traversal distance at equivalent reconstruction error, validated on a two-USV team in outdoor field trials.
          - Built and ran the full deployment stack for these trials with ROS coordination, echosounder and GPS/IMU integration, and mission execution on water.

      - company: Department of EEE, IIT Guwahati
        position: Visiting Student Researcher (concurrent with MOON Lab)
        location: Guwahati, India
        start_date: 2025-03
        end_date: 2025-10
        highlights:
          - Visiting researcher at the Energy Resilience Research Lab under Dr. Prabir Barooah.
          - Built an autonomous field-testing platform and conducted real-world experimental validation.

      - company: Multi-Robot Autonomy (MOON) Lab, IISER Bhopal
        position: Undergraduate Researcher
        location: Bhopal, India
        start_date: 2023-08
        end_date: 2025-04
        highlights:
          - Co-developed a search-based collision avoidance strategy encoding COLREGs maritime traffic rules for autonomous surface vessels, enabling rule-compliant safe navigation.
          - Prototyped autonomous robotic systems covering sensing, control, deployment, and field trials.

    Projects:
      - name: "MA-BaTS: Multi-agent Adaptive Bathymetry Mapping using Thompson Sampling"
        summary: MOON Lab, IISER Bhopal
        start_date: 2025-06
        end_date: present
        highlights:
          - Developed a learning-based adaptive framework for collaborative bathymetric mapping, combining Gaussian Process reconstruction on the seafloor depth field with multi-robot decision making and control under limited sensing.
          - Achieved a ~68% reduction in traversal distance at equivalent reconstruction error; framework validated in real-world field deployments.

      - name: "EcoBoat: Autonomous Cleaning Boat (v2)"
        summary: MOON Lab, IISER Bhopal
        start_date: 2024-12
        end_date: 2025-02
        highlights:
          - Developed an autonomous lake-cleaning robot with Tesla-valve-inspired passive debris collection.
          - Implemented random-sampling-based coverage planning for debris collection missions.

      - name: "AquaRP: Autonomous Surface Vehicle (ASV) Research Platform"
        summary: MOON Lab, IISER Bhopal & IIT Guwahati
        start_date: 2024-08
        end_date: 2024-09
        highlights:
          - Designed and integrated a low-cost ($2200) autonomous surface vehicle with embedded control (Pixhawk), onboard computation (NVIDIA Jetson), and multi-modal sensing (camera, GPS/IMU, echosounder).
          - Implemented autonomous navigation and multi-agent coordination, enabling collaborative field missions and real-world system validation.

      - name: Manipulator Arm for Pick-and-Place Task
        summary: MOON Lab, IISER Bhopal
        start_date: 2023-12
        end_date: 2024-07
        highlights:
          - Designed a custom 5-DOF manipulator; implemented kinematic control using Robotics Toolbox.
          - Integrated vision-based object pose estimation using FoundationPose.

      - name: Autonomous Cleaning Boat
        summary: MOON Lab, IISER Bhopal
        start_date: 2023-05
        end_date: 2023-07
        highlights:
          - Developed an autonomous debris-cleaning robot with YOLOv5s-based detection in VRX simulation.
          - Deployed onboard computation using Jetson Nano with Pixhawk-based navigation.

      - name: "GesTr: Wearable Indian Sign Language Translation Device"
        summary: ED'ICT Lab, IISER Bhopal
        start_date: 2022-12
        end_date: 2023-03
        highlights:
          - Developed a wearable ISL-to-text/audio system with 97% real-time accuracy; shortlisted at 2022-23 IEEE CASS SDC.

